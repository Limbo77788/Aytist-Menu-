name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        platform: [ android64 ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI
        run: |
          wget https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip
          unzip geode-cli-linux.zip -d geode-cli
          echo "$(pwd)/geode-cli" >> $GITHUB_PATH

      - name: Setup Geode SDK
        run: |
          geode sdk install ${{ matrix.platform }}
          geode sdk install-binaries ${{ matrix.platform }}

      - name: Build Mod
        run: |
          geode build -p ${{ matrix.platform }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/*.geode
